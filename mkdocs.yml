site_name: 'Exchange Online Lab Notes'
site_description: 'Hands-on notes on Exchange Online mail flow, connectors and relays'
site_url: https://jeanpaulnk.github.io/mail-flow-lab-notes/
repo_url: https://github.com/jeanpaulnk/mail-flow-lab-notes
edit_uri: edit/main/docs/
docs_dir: 'docs'
nav:
  - Home: index.md
  - Transport:
    - Postfix relay as an add-on service: Transport/Postfix-Relay-Add-On-Service.md
theme:
  name: 'material'
  features:
    - navigation.indexes
    - content.action.edit
    - content.code.copy
  icon:
    admonition:
      note: octicons/tag-16
      info: octicons/info-16
      success: octicons/check-16
      bug: octicons/bug-16
      warning: octicons/alert-16
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
